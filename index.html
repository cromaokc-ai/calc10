<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <style>
        /* CSS Básico para estilização */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o padding não aumente a largura */
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 4px;
            display: none; /* Escondido até o cálculo */
        }

        .normal { background-color: #d4edda; color: #155724; }
        .alerta { background-color: #fff3cd; color: #856404; }
        .perigo { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Calculadora de IMC</h1>
        
        <div class="input-group">
            <label for="weight">Peso (kg):</label>
            <input type="number" id="weight" placeholder="Ex: 75.5" step="0.1">
        </div>

        <div class="input-group">
            <label for="height">Altura (m):</label>
            <input type="number" id="height" placeholder="Ex: 1.75" step="0.01">
        </div>

        <button onclick="calculateBMI()">Calcular IMC</button>

        <div id="result"></div>
    </div>

    <script>
        /* JavaScript Vanilla para lógica */
        function calculateBMI() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const resultDiv = document.getElementById('result');

            // Validação simples
            if (!weight || !height || weight <= 0 || height <= 0) {
                alert("Por favor, insira valores válidos para peso e altura.");
                return;
            }

            // Cálculo do IMC: peso / (altura * altura)
            const bmi = (weight / (height * height)).toFixed(2);
            let classification = "";
            let alertClass = "";

            // Lógica de classificação
            if (bmi < 18.5) {
                classification = "Abaixo do peso";
                alertClass = "alerta";
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                classification = "Peso normal";
                alertClass = "normal";
            } else if (bmi >= 25 && bmi <= 29.9) {
                classification = "Sobrepeso";
                alertClass = "alerta";
            } else if (bmi >= 30 && bmi <= 34.9) {
                classification = "Obesidade Grau I";
                alertClass = "perigo";
            } else if (bmi >= 35 && bmi <= 39.9) {
                classification = "Obesidade Grau II";
                alertClass = "perigo";
            } else {
                classification = "Obesidade Grau III";
                alertClass = "perigo";
            }

            // Exibição do resultado
            resultDiv.style.display = "block";
            resultDiv.className = alertClass;
            resultDiv.innerHTML = `<strong>Seu IMC é: ${bmi}</strong><br>${classification}`;
        }
    </script>

</body>
</html>
